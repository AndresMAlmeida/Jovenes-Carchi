<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Jóvenes en Acción 4 · Carchi</title>
  <style>
    :root {
      --bg: #F5F4EF;
      --surface: #FFFFFF;
      --primary: #133B33;
      --primary-hover: #0E2C26;
      --accent: #D79B2B;
      --accent-bg: #DFB054;
      --text: #1B2421;
      --muted: #5C6B66;
      --border: #E2E5E3;
      --danger-bg: #FDECEA;
      --danger-text: #B42318;
      --info-bg: #EAF1EE;
      --info-text: #1B4B43;
      --radius: 16px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, Helvetica, Arial, sans-serif;
    }

    body {
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      justify-content: center;
    }

    .app-shell {
      width: 100%;
      max-width: 540px;
      min-height: 100vh;
      background: var(--bg);
      display: flex;
      flex-direction: column;
      padding-bottom: 88px;
    }

    /* Encabezado */
    .app-header {
      background: var(--primary);
      color: #FFFFFF;
      padding: 20px 20px 18px;
      border-bottom: 3px solid var(--accent);
    }

    .header-kicker {
      font-size: 12.5px;
      font-weight: 600;
      color: #CFE0DC;
      margin-bottom: 4px;
    }

    .header-title {
      font-size: 24px;
      font-weight: 800;
      letter-spacing: -0.02em;
      margin-bottom: 14px;
    }

    .step-track {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 10px;
    }

    .step-dot {
      height: 4px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.24);
      transition: background 0.25s ease;
    }

    .step-dot.active {
      background: var(--accent);
    }

    .step-dot.done {
      background: #7AC4B2;
    }

    .step-label {
      font-size: 13px;
      color: #D7E5E1;
    }

    /* Contenido */
    .app-main {
      padding: 18px 16px 24px;
      flex: 1;
    }

    .screen {
      display: none;
    }

    .screen.active {
      display: block;
    }

    /* Pantalla 1: Búsqueda */
    .search-hero {
      text-align: center;
      padding-top: 24px;
    }

    .search-icon {
      width: 46px;
      height: 46px;
      margin: 0 auto 14px;
      border-radius: 12px;
      background: #3B82F6;
      color: #FFFFFF;
      font-size: 26px;
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 12px rgba(59, 130, 246, 0.28);
    }

    .search-desc {
      font-size: 15px;
      color: var(--muted);
      line-height: 1.45;
      max-width: 340px;
      margin: 0 auto 20px;
    }

    .cedula-input {
      width: 100%;
      padding: 16px 18px;
      font-size: 22px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-align: center;
      color: var(--text);
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-radius: 14px;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .cedula-input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(19, 59, 51, 0.12);
    }

    .input-hint {
      font-size: 13px;
      color: var(--muted);
      margin-top: 10px;
    }

    /* Alertas */
    .alert {
      display: none;
      margin-top: 16px;
      padding: 14px 16px;
      border-radius: 12px;
      font-size: 14px;
      line-height: 1.45;
      text-align: left;
    }

    .alert.show {
      display: block;
    }

    .alert-error {
      background: var(--danger-bg);
      color: var(--danger-text);
      border: 1px solid #F9C6C2;
    }

    .alert-info {
      background: var(--info-bg);
      color: var(--info-text);
      border: 1px solid #CBE0D8;
    }

    /* Tarjetas */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 18px;
      margin-bottom: 14px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.03);
    }

    .card-kicker {
      font-size: 11.5px;
      font-weight: 800;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--primary);
      padding-bottom: 10px;
      margin-bottom: 12px;
      border-bottom: 1px solid var(--border);
    }

    .person-name {
      font-size: 20px;
      font-weight: 800;
      color: var(--text);
      line-height: 1.25;
      margin-bottom: 6px;
    }

    .person-id {
      font-size: 14px;
      color: var(--muted);
      margin-bottom: 12px;
    }

    .tutor-badge {
      display: inline-block;
      background: var(--accent-bg);
      color: #1F1A0E;
      font-size: 13px;
      font-weight: 700;
      padding: 6px 14px;
      border-radius: 999px;
      margin-bottom: 14px;
    }

    .info-list {
      display: flex;
      flex-direction: column;
    }

    .info-row {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
      padding: 11px 0;
      border-bottom: 1px solid #EEF0EF;
      font-size: 14px;
    }

    .info-row:last-child {
      border-bottom: none;
      padding-bottom: 2px;
    }

    .info-label {
      color: var(--muted);
      flex-shrink: 0;
    }

    .info-value {
      font-weight: 700;
      color: var(--text);
      text-align: right;
    }

    .status-banner {
      padding: 14px 16px;
      border-radius: 14px;
      font-size: 13.5px;
      line-height: 1.45;
      background: var(--info-bg);
      color: var(--info-text);
    }

    /* Formularios */
    .field {
      margin-bottom: 14px;
    }

    .field:last-child {
      margin-bottom: 0;
    }

    .field-label {
      display: block;
      font-size: 13.5px;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 7px;
    }

    .field-hint {
      font-size: 13.5px;
      color: var(--muted);
      margin-bottom: 12px;
      line-height: 1.4;
    }
